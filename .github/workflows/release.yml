name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-native:
    if: github.repository == 'k1tbyte/Wand-Enhancer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cross-compile the version.dll proxy on Linux via MinGW-w64 in a container.
      - name: Build native proxy DLL (docker)
        run: docker build -o type=local,dest=./native-out tools/asar-fuses-bypass

      - uses: actions/upload-artifact@v4
        with:
          name: version-dll
          path: native-out/version.dll
          if-no-files-found: error

  publish-release:
    if: github.repository == 'k1tbyte/Wand-Enhancer'
    needs: build-native
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Place the prebuilt proxy DLL where build.ps1 / the .csproj expect it.
      - uses: actions/download-artifact@v4
        with:
          name: version-dll
          path: .tmp/cmake/asar-fuses-bypass/Release

      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/validate-release-metadata.ps1 -ExpectedVersion $env:RELEASE_VERSION

      - name: Extract release notes from changelog
        shell: pwsh
        run: ./scripts/get-changelog-section.ps1 -Version $env:RELEASE_VERSION -OutputPath release-notes.md

      - name: Build release
        shell: pwsh
        run: ./build.ps1 -Configuration Release -SkipNativeBuild

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            WandEnhancer/bin/Release/net10.0-windows/win-x64/publish/WandEnhancer.exe
            CHANGELOG.md
          fail_on_unmatched_files: true
